# joint_limits.yaml allows the dynamics properties specified in the URDF to be
# overwritten or augmented as needed.  These values were taken from the ABB
# CRB 15000 robot’s specification and converted from degrees per second to
# radians per second.  Update the acceleration limits with manufacturer
# values if available.

joint_limits:
  joint_1:
    has_velocity_limits: true
    max_velocity: 2.18  # 125 deg/s
    has_acceleration_limits: true
    max_acceleration: 5.0
